<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>叙事管理局</title>
<meta name="description" content="《叙事管理局》第一人称 3D 网页探索游戏：新人报到第一天。" />
<style>
@font-face { font-family: 'NB Serif'; src: url('fonts/serif-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'NB Serif'; src: url('fonts/serif-semibold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'NB Serif'; src: url('fonts/serif-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'NB Title'; src: url('fonts/title.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
@font-face { font-family: 'NB Sans'; src: url('fonts/sans-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'NB Sans'; src: url('fonts/sans-medium.woff2') format('woff2'); font-weight: 500 700; font-display: swap; }
@font-face { font-family: 'NB Latin Title'; src: url('fonts/latin-title.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
@font-face { font-family: 'NB Latin'; src: url('fonts/latin-serif.woff2') format('woff2'); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'NB Latin'; src: url('fonts/latin-italic.woff2') format('woff2'); font-weight: 400 700; font-style: italic; font-display: swap; }
h1 { font-family: var(--title); }
#reader .paper { background-image: url('assets/tex/Paper006_color.webp'); }
#reader .paper.dark, #reader .paper.screen, #reader .paper.phone { background-image: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">
  <div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>
  <div class="cls">京城总部 · 内部资料 · 注意保存</div>
  <svg class="emb" viewBox="-60 -60 120 120" aria-hidden="true">
    <defs><linearGradient id="cu" x1="0" y1="-1" x2="0" y2="1"><stop offset="0" stop-color="#e2bf86"/><stop offset=".55" stop-color="#b0814a"/><stop offset="1" stop-color="#6e4a26"/></linearGradient></defs>
    <g fill="none" stroke="url(#cu)"><circle r="54" stroke-width="2.2"/><circle r="49.5" stroke-width=".6"/><circle r="31" stroke-width="1.2"/></g>
    <g stroke="#b0814a" stroke-width=".8" id="tk"></g>
    <path fill="url(#cu)" d="M0-46 6-6 46 0 6 6 0 46-6 6-46 0-6-6Z" opacity=".95"/>
    <path fill="#7a5530" d="M0-24 3.2-3.2 24 0 3.2 3.2 0 24-3.2 3.2-24 0-3.2-3.2Z" transform="rotate(45)"/>
    <g transform="translate(0 1)"><path fill="#13221b" stroke="#e2bf86" stroke-width=".9" d="M-11-6Q-5-8 0-5Q5-8 11-6V7Q5 5 0 8Q-5 5-11 7Z"/><path stroke="#e2bf86" stroke-width=".7" d="M0-5V8"/></g>
  </svg>
  <h1>叙事管理局</h1>
  <div class="sub"><span class="ln"></span>NARRATIVE BUREAU<span class="dot">·</span>京城总部<span class="ln"></span></div>
  <blockquote class="quote">凡未经登记之叙事，视同不存在。<cite>——《叙事管理局内务条例》第一条</cite></blockquote>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="bmeta"><span class="tip" id="loadtip">正在装订页面……</span><span class="pct" id="loadpct">0%</span></div>
  <button id="start" class="hidden"><span>进　入</span></button>
  <div class="foot">档案号 NB-0001 · 第一卷 · 报到</div>
</div>
<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="obj"><div class="t">当前目标</div><div class="m" id="objm"></div><div class="o" id="objo"></div></div>
  <div id="area"><div class="n" id="arean"></div><div class="e" id="areae"></div></div>
  <div id="toast"></div>
  <div id="inv"></div>
  <div id="fps"></div>
</div>
<div id="dlg" class="hidden"><div class="who" id="dlgwho"></div><div class="line" id="dlgline"></div><div class="choices" id="dlgch"></div><div class="next">E / 点击 继续</div></div>
<div id="reader" class="hidden"><div class="paper" id="paper"></div><div class="help">滚轮 / ← → 翻页　·　E 下一页　·　Esc 关闭</div></div>
<div id="pause" class="hidden"><div class="panel">
  <h1>暂停</h1><div class="sub">叙事管理局 · 京城总部</div>
  <div class="row"><span>画质</span><div class="seg" id="qseg"></div></div>
  <div class="row"><span>时段</span><div class="seg" id="todseg"><span data-t="day">白昼</span><span data-t="dusk">黄昏</span></div></div>
  <div class="row"><span>鼠标灵敏度</span><input type="range" id="sens" min="0.3" max="3" step="0.05" value="1"></div>
  <div class="row"><span>视野（FOV）</span><input type="range" id="fov" min="55" max="95" step="1" value="70"></div>
  <div class="row"><span>主音量</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.8"></div>
  <div class="row"><span>音乐</span><input type="range" id="volm" min="0" max="1" step="0.05" value="0.55"></div>
  <div class="row"><span>性能面板（帧率/drawcall）</span><div class="seg" id="fpsseg"><span data-v="0" class="on">关</span><span data-v="1">开</span></div></div>
  <div class="keys">WASD 移动　·　Shift 奔跑　·　空格 跳　·　E 查看 / 拾取 / 翻页　·　Tab 物品　·　Esc 暂停</div>
  <div class="btns"><button class="btn" id="resume">继续</button><button class="btn" id="showcred">致谢</button></div>
  <div id="credits" class="hidden"></div>
</div></div>
<div id="chapter"><div class="a" id="chapa"></div><div class="b" id="chapb"></div></div>
<div id="fade"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
