# 托管 runner 出截图（本机 8GB 拍 1600×900 high 必 OOM）。只手动触发，不影响 pages.yml。
# shots 输入：分号分隔，每项 "组:机位[:额外参数]"，如 "after:cs_r3;before:cs_r3:&r3off=citizen_service"
# 每项一个矩阵任务（各自独立 runner 4 vCPU/16 GB、新开浏览器），产物 artifact 名 shot-<组>-<机位>，内含 <组>/<机位>.png + .log
# 取图：GET /repos/<repo>/actions/runs/<run>/artifacts → /actions/artifacts/<id>/zip（见 tools/gh_shots_fetch.sh；docs/HANDOFF.md「Actions 截图」）
name: Screenshots
on:
  workflow_dispatch:
    inputs:
      shots:
        description: '机位清单：组:机位[:额外参数]，分号分隔'
        required: true
        default: 'after:cs_r3'
      quality:
        description: '画质档 q'
        required: true
        default: 'high'
      width:
        description: '宽'
        required: true
        default: '1600'
      height:
        description: '高'
        required: true
        default: '900'
      frames:
        description: 'frames'
        required: false
        default: '8'
permissions:
  contents: read
  actions: read
concurrency:
  group: shots-${{ github.run_id }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SHOTS: ${{ inputs.shots }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json
          items = []
          for raw in os.environ['SHOTS'].split(';'):
              raw = raw.strip()
              if not raw: continue
              p = raw.split(':', 2)
              if len(p) == 1: p = ['after'] + p
              items.append({'grp': p[0], 'shot': p[1], 'extra': p[2] if len(p) > 2 else ''})
          print('matrix=' + json.dumps({'include': items}, ensure_ascii=False))
          PY
  shot:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 安装 headless shell（与 playwright-core 同版本）
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: 拍
        env:
          GRP: ${{ matrix.grp }}
          SHOT: ${{ matrix.shot }}
          EXTRA: ${{ matrix.extra }}
        run: |
          free -m; nproc
          CHROME=$(find ~/.cache/ms-playwright -type f \( -name headless_shell -o -name chrome-headless-shell \) | head -1)
          echo "CHROME=$CHROME"
          mkdir -p out/$GRP
          if [ "$GRP" = "walk" ]; then # 批次16：剧情走查前台跑完（本机 120 s 前台上限 + 后台会被回收）
            CHROME="$CHROME" timeout 2400 node tools/walk.mjs --out out/walk/WALKTHROUGH.md 2>&1 | tee out/walk/walk.log; exit 0; fi
          if [ "$GRP" = "ui" ] || [ "${GRP#ui}" != "$GRP" ]; then # 批次46：UI 叠层截图（不渲 3D）
            if [ -n "$EXTRA" ]; then git fetch -q --depth=50 origin main; git checkout "$EXTRA" -- index.html src/ui && npm run build >/dev/null; fi # EXTRA=旧提交号 → 拍改前 UI
            CHROME="$CHROME" node tools/ui_shot.mjs out/$GRP "$SHOT" 2>&1 | tee out/$GRP/ui.log; exit 0; fi
          if [ "$GRP" = "pick" ]; then # 批次16：拾取探针（EXTRA = 空格分隔的 NDC 坐标对）
            CHROME="$CHROME" node tools/_pick.mjs "$SHOT" $EXTRA 2>&1 | tee out/pick/$SHOT.log; exit 0; fi
          CHROME="$CHROME" node tools/shot.mjs out/$GRP "$SHOT" --q ${{ inputs.quality }} --w ${{ inputs.width }} --h ${{ inputs.height }} --frames ${{ inputs.frames }} --fresh 1 --gtimeout 1500000 --stimeout 600000 --extra "$EXTRA" 2>&1 | tee out/$GRP/$SHOT.log
          free -m
          test -f out/$GRP/$SHOT.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.grp }}-${{ matrix.shot }}
          path: out
          if-no-files-found: warn
          retention-days: 14
